<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ringraziamenti – Tesi di Laurea</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
            padding: 2rem 2rem 2.5rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            transition: all 0.2s ease;
        }
        h1 {
            font-size: 2rem;
            color: #1e3c72;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .sub {
            color: #2c3e66;
            margin-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
            display: inline-block;
            padding-bottom: 6px;
        }
        .input-group {
            margin-bottom: 1.8rem;
            text-align: left;
        }
        label {
            font-weight: 600;
            color: #1e3c72;
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            border: 2px solid #dce4ec;
            border-radius: 50px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        input:focus {
            border-color: #2a5298;
            box-shadow: 0 0 0 3px rgba(42,82,152,0.2);
        }
        button {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
            width: 100%;
            margin-top: 8px;
            letter-spacing: 1px;
        }
        button:hover {
            background: #0f2b4f;
            transform: scale(0.98);
        }
        .error {
            color: #c0392b;
            background: #ffe6e5;
            padding: 12px;
            border-radius: 50px;
            margin-top: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            display: none;
        }
        .message-area {
            background: #eafaf1;
            border-left: 7px solid #27ae60;
            padding: 20px;
            border-radius: 20px;
            margin-top: 25px;
            text-align: left;
            display: none;
        }
        .message-area h3 {
            margin: 0 0 12px 0;
            color: #1e3c72;
            font-size: 1.5rem;
        }
        .message-area p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #2c3e50;
            margin: 0;
        }
        .reset-btn {
            background: #95a5a6;
            margin-top: 15px;
            width: auto;
            padding: 8px 20px;
            font-size: 0.9rem;
            display: inline-block;
        }
        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #aaa;
        }
    </style>
</head>
<body>
<div class="card" id="loginCard">
    <h1>🎓 Grazie di cuore</h1>
    <div class="sub">Ho un pensiero speciale per te</div>

    <div class="input-group">
        <label>👤 Inserisci il tuo nome e cognome (non lasciare spazi tra i due)</label>
        <input type="text" id="userInput" autocomplete="off">
    </div>
    <button id="loginBtn">➡️ Scopri il tuo messaggio</button>
    <div id="errorMsg" class="error">❌ Nome non riconosciuto. Riprova o contattami se pensi sia un errore.</div>

    <footer>🔐 Solo le persone a me vicine hanno accesso</footer>
</div>

<script>
    // ------------------------------------------------------------------
    // 1. DEFINISCI QUI I TUOI MESSAGGI PERSONALIZZATI
    //    (Aggiungi tutte le persone che vuoi ringraziare)
    // ------------------------------------------------------------------
    const messages = {
	"robertalorenzetti": "Mamma, questo traguardo è tuo quanto mio. Grazie per ogni sacrificio, per ogni notte insonne, per ogni capello che ti ho rubato quenado te li giravo. Ti voglio bene anche se tante volte non riesco a dimostrartelo. Siamo così noi Ascenzi, buzzurri fuori ma dal cuore tenero. Mi hai cresciuto, educato, guidato e fatto diventare la persona che sono oggi. Non potrò mai sdebitarmi per tutto questo, spero solamente ti averti reso orgogliosa di me. Sei mia madre, la mia confidente, l'unica che mi conosce e che sa capirmi con un solo sguardo, anche primache io ti dica qualcosa. Per tutto questo GRAZIE! Spero di averti resa orgogliosa e fiera di me.",
        "massimoascenzi": "Papà, mi hai insegnato il valore della parola data, dell'importanza di rispettare un impegno preso e mi ha insegnato come si sta al mondo (sappi che dovrai continuare a farlo). Magari non sempre andiamo d'accordo, abbiamo due caratteri molto simili, tendiamo ad infuocarci subito senza ascoltare quello che l'altra persona ci dice, d'altronde noi Ascenzi siamo così. Sei e sarai sempre un esempio da ammirare. Spero di averti reso orgoglioso. Grazie per esserci sempre.",
        "agneseascenzi": "Grazie perché sei te, amorevole a tuo modo, sempre pronta a ricevere un abbraccio. Stai crescendo e la cosa da una parte mi spaventa, dall'altra mi rende super fiero di quello che stai diventando. Grazie perché anche in lontananza non mi hai messo da parte. Ti voglio bene!",
        "leonardoascenzi": "Non siamo due chiacchieroni, tu sicuramente anche meno di me, ma con i gesti a volte diciamo tante cose. Mi spiace se puoi esserti sentito violato quando ho iniziato a giocare a boccette e a venire più spesso in bocciofila. È il tuo posto, non voglio rubartelo. Volevo solo avvicinarmi a te, perché non ti vedevo sereno e volevo capire cosa ti stesse accadendo, poi per fortuna tutto si è sistemato quando sei tornato con Giulia. Sei il mio bodybuilder preferito. Faccio il tifo per te, qualsiasi cosa tu faccia e vorrai fare. Ti voglio bene!",
        "giuliatanoni": "Giulietta, per fortuna ci sei te. Quando te ne sei andata hai lasciato un vuoto, oltre che in Leo anche in tutti noi. È stato bello averti ritrovato e penso che mio fratello sia davvero fortunato! Grazie perché ci sei stata per fare due chiacchiere, per aver indagato per me e per aver reso di nuovo Leo una persona felice!",
	"simonesciamanna": "Simo, sei entrato da poco in famiglia, in punta di piedi. Siamo un po' particolari, magari lo hai già capito o lo scoprirai con il tempo. Grazie per rendere mia sorella e grazie di essere quì!"
	"ceciliabettucci": "Piccoletta, che strano, che bello. Non ho mai perso la speranza che avremmo potuto affrontare questo passo così importante l’uno al fianco dell’altro. 
Te l’ho ripetuto mille volte in questi giorni, ma sono davvero grato per la tua presenza: non solo in questi giorni così importanti e intensi, ma anche per quella quotidiana. È stata davvero la cosa più bella di tutte averti lì, dietro di me, a seguirmi in questo passo così importante. Sei stata l’unica persona che sono riuscito a guardare dopo il discorso, cercavo il tuo sguardo, i tuoi occhi, perché chi non ha mai visto nascere una dea non lo sa che cos'è la felicità, e io in quel momento l'ho capito. È avere te al mio fianco in momenti così importanti e sapere di averti reso orgogliosa. 
In cuor mio sapevo che solo tu, dopo i mille ascolti, mi avresti compreso e mi avresti guardato con gli occhi di chi era fiera, come se il traguardo fosse anche suo; e così è. Questo traguardo è nostro, e non potevo desiderare di meglio. La tua presenza è il regalo più bello che ci sia. Sei speciale, sei unica.
Se sono riuscito a laurearmi e a superare quest’ultimo enorme scoglio, il merito è anche tuo. Non dimenticherò mai quanto tu mi sia stata vicina quando pensavo di mollare tutto e quanto tu sia stata una motivazione fortissima. Non ho mai voluto mostrarmi incapace di riuscire in qualcosa quando c’eri tu al mio fianco.
In questi anni, mentre il mondo cadeva a pezzi, io componevo nuovi spazi e desideri che appartenevano anche a te, tu sei stata e sei tutt'ora l'essenziale, ciò che mi sprona, ciò che mi ha spinto a proseguire, perché in cuor mio sapevo che saresti stata immensamente orgogliosa di me. 
Grazie per avermi accompagnato in questi anni, devastanti, ma finalmente è arrivato anche il nostro “matrimonio”: la mia laurea.
D'altronde lo sappiamo, il nostro amore è sempre stato un po' una scommessa, e oggi, guardandoti, posso dirti con certezza che siamo troppo belli, troppo matti per dividerci la vita, e non vedo l'ora di scoprire cosa ci riserverà il futuro, perché i miei occhi con i tuoi sono molto meglio di un film.
Grazie anche perché sei stata disposta a riaprire una ferita che si stava ormai rimarginando e mi hai nuovamente accolto nella tua vita. Mi impegnerò al massimo per renderti fiera di me in tutto ciò che farò. Comincerò, chiaramente, dal cercare di essere un fidanzato modello (premetto che sarà impossibile: ho troppi difetti), ma, con tutte le mie difficoltà, ti garantisco che mi impegnerò a renderti felice. Perché questo è ciò che fai tu: mi rendi felice con la tua forza e con il tuo modo di essere.
Amo ciò che sei. I litigi, gli scontri e tutto ciò che abbiamo attraversato fanno parte di un cammino nel quale è importante che tu sia al mio fianco, che mi prenda per mano e che me la stringa fortissimo.
Mi auguro davvero di averti resa fiera e orgogliosa. 
Ora tocca a te fare altrettanto!
Ti amo
Tuo Giacomo"
        "alessandroformenti": "Amico di una vita. Ripenso a quando le nostre mamme ci portarono all'asilo nido, poi alle elementari. Sempre insieme fin da bambini. Finita la scuola, pranzo, compiti e subito al Campo dei Pini o al campetto di Colleverde. Ognuno ha preso la sua strada alle medie, per poi incontrati di nuovo alle superiori per finire di nuovo divisi e sparsi per l'Italia. Macerata ti è sempre stata stretta e te ne sei scappato a Milano. Certo, ci vediamo poco, ma quei pochi giorni che ci vediamo sappiamo farci valere. Grazie per tutte le volte che sei stato ad ascoltarmi per ore senza chiedere nulla in cambio. Ti ammiro molto e ti voglio bene.",
        "andreapiccinini": "Sei speciale. È stata una fortuna averti conosciuto. Riesci ad alleggerire i momenti tristi con la tua spensieratezze e leggerezza. Sei una persona intelligente e sensibile come pochi. Mi manca il tempo che passavamo insieme, come quell'Halloween trascorso nel tuo garage. Mi manca stare con te, quando torni il tempo passa veloce e tra i mille impegni che abbiamo riusciamo a vederci sempre troppo poco. 
Presto riusciremo a rifarci un viaggetto. 
Do you remember what the frog is doing? Grazie di tutto Andre!",
        "tommasograttini": "Il mio primo gymbro. Possiamo dire che la mia ossessione è nata con te al mio fianco, tutti i giorni fregandocene delle maledette zone gialle, arancio e rosse. È vero, la distanza non aiuta, ma non può cancellare ciò che siamo stati e quello che possiamo continuare ad essere. Sì, abbiamo litigato, ci siamo scontrati, ma sono i nostri caratteri e ancora di più è il bene che ci vogliamo che ci spinge a farlo e questo è la cosa più importante e che sempre rimarrà. Grazie perché ci sei e ti preoccupi per me. Ti voglio bene soldato!",
        "giorgiocaponi": "Per fortuna sono venuto a lavorare a Villa Castellani. Sei davvero quell’amico raro di cui si parla tanto. 
Le dinamiche della vita, a volte, ci hanno fatti rimbalzare lontano, ma non ci hanno mai separati, perché sappiamo che possiamo sempre fidarci l’uno dell’altro. 
Ho bisogno di un amico come te: uno che, se sbaglio, me lo dice senza giudicarmi; disposto a farsi raccontare la stessa storia 2500 volte, sapendo che probabilmente non sarà nemmeno l’ultima.
Spero che presto riusciremo a ritagliarci una serata come quelle di qualche annetto fa, liberi e spensierati. Ballavamo sudati fradici al Barracuda, con 36/48 ore di lavoro sulle spalle, e non ci importava. Quello era il nostro posto: nessuno poteva togliercelo e nessuno poteva fermarci. Magari sarà proprio a Venezia, chissà cosa succederà.
Ci tenevo a ringraziarti per il sostegno che mi hai dato durante questi anni di università e, più in generale, nella mia vita.
Ti voglio bene, Chicco!",        
        "pietroseverini": "Oh bello, sei l’unica persona che può davvero dire di avermi visto crescere. Dall’asilo nido a oggi siamo sempre stati vicini, sempre l’uno al fianco dell’altro, come Bud e Terence. Forse è anche per questo che sei la persona che mi conosce meglio: ti basta guardare la mia espressione per capire a cosa sto pensando, e allo stesso modo capisci se ti sto raccontando una cazzata. Come i nostri idoli, sai che insieme possiamo fare qualunque cosa ci venga in mente.
Grazie per avermi accompagnato e per essere stato il mio primo confidente in tutti questi anni. Sei capace di darmi consigli e prospettive diverse, facendomi capire dove sbaglio e perché lo faccio. Grazie anche perché sei l’unico che, pur sapendo tutto, ha comunque dato a Cecilia la possibilità di redimersi e ha persino cambiato idea su di lei.
Non sarà mai importante quanto te, sia chiaro, ma lei è davvero speciale per me; per questo sono contento che tu abbia cambiato idea nei suoi confronti.
Ti voglio bene, bello!,
        "edoardodipietrantonio": "Abbiamo condiviso veramente una vita insieme, le prime scuole, il calcio. Crescendo ognuno ha fatto la propria vita, consapevole che lì, da qualche parte c'era l'altro. Prima magari guidati dai nostri genitori, poi da soli ci siamo sempre rimasti vicini. È stato bello ritrovarti a Padova, sei stato un ancora in uno dei periodi più bui della mia vita, ma anche un'ispirazione, un continuo insegnamento. Mi sono sentito come se fossi uscito dalla grotta e stessi finalmente esplorando un mondo per me nuovo e te mi hai aiutato a comprenderlo e ad apprezzarlo. Ti ringrazio perché se oggi sono una persona più cosciente del mondo che mi circonda lo devo molto anche a te! Ho pensato spesso ad una cosa, mentre vivevamo insieme a Padova. Sei stato per me un fratello maggiore, capace di darmi i consigli giusti, mostrarmi il mondo da una prospettiva più saggia e corretta. Senza mai essere invadente, ma rimanendo sempre presente. Te nesarò sempre grato.
Ti voglio bene! ",
	"corradobonvini":"Un grazie speciale zio, che con il tuo esempio e il tuo sostegno mi hai accompagnato in questi anni. Grazie per l'affetto e la vicinanza durante questo percorso. Grazie anche per avermi mostrato come ci si veste con stile. Ti voglio bene."
	"silvialorenzetti":"Grazie di cuore, zia, per l’affetto, i consigli e la presenza costante. In questo giorno così importante sento ancora di più la tua vicinanza. Grazie per avermi accompagnato con dolcezza, per essermi sempre stata vicino, per avermi sostenuto e fatto sentire il tuo affetto. Sei la mia zia simpatica, scherzosa e stravagante. Adoro il tuo modo di essere. Ti voglio bene."
	"elisabonvini":"Eli, grazie di cuore per essere tornata, è significato tanto per me. Sei la cugina a cui sono più legato: da piccoli passavamo tantissimo tempo insieme, e anche se da qualche anno vivi all’estero e ci vediamo meno, quando ci ritroviamo è sempre bello stare insieme e raccontarci come va la nostra vita durante i pranzi di famiglia. Grazie per esserci sempre, anche a distanza. Prima o poi passerò a trovarti, non ti preoccupare. Ti voglio bene."
	"mariavittoriabonvini":"Maria Vittoria, sei una persona speciale: ammiro la tua determinazione e la passione con cui so che ti dedichi allo studio. È bello condividere momenti insieme, come quest’estate. Ti auguro ogni bene. Ti voglio bene."
	"margheritabonvini":"Marghe, sei la più piccola delle cugine, ma sei anche la più simpatica: hai sempre un modo tenero e dolce che riesce a strapparci un sorriso. Grazie per la tua dolcezza. Ti voglio bene."
	"stefanoascenzi":"Come tutti gli Ascenzi, non sono di molte parole. Sei mio zio, il mio padrino, un altro esempio da seguire dopo quel testone di tuo fratello. 
Con la tua calma e la tranquillità che ti hanno sempre contraddistinto, proprio come nonno, mi hai insegnato molto. Grazie per avermi sempre accomapgnato e sostenuto. 
Ti voglio bene. "
	"marialaurafermanelli":"Grazie di cuore zia, per l’affetto, i consigli e la presenza costante. In questo giorno così importante sento ancora più forte la tua vicinanza. Grazie per avermi accompagnato in questa prima parte del mio cammino. Ti voglio bene."
	"federicoascenzi":"Fede, con te è sempre bello ritrovarsi: tra una seduta da osteopata e una chiacchierata, troviamo sempre il modo di aggiornarci e raccontarci come va la nostra vita. Mi fa piacere sapere di poter contare sulla tua presenza. E poi quanti ricordi a casa di nonna, quando da piccoli passavamo ore a giocare insieme: momenti semplici che porto nel cuore. Grazie per esserci, per l’affetto e per la vicinanza. Ti voglio bene."
	"beatriceascenzi":"Bea, grazie di cuore per l'affetto dimostrato in questi giorni e non solo. Anche se vivi all’estero da diversi anni, è sempre bellissimo sentirci, rivederci e chiacchierare quando ci ritroviamo. Grazie per il tuo affetto anche a distanza. Ti voglio bene."
	"brunellabrandoni": "Grazie per avermi cresciuto, per avermi accompagnato durante tutta la vita. Se sono la persona che sono, ora anche un Ingegnere, è anche merito tuo e di nonno. Ti voglio bene.",
	"ritafortuna": "Grazie per avermi cresciuto, per avermi accompagnato durante tutta la vita. Se sono la persona che sono, ora anche un Ingegnere, è anche merito tuo e di nonno. Ti voglio bene.",
        "francescomaccari": "Franci, siamo cresciuti insieme: prima le medie, poi le superiori, sempre in classe e nello stesso gruppo. Sei una persona buona, dall’animo puro. Silenzioso, attento e umile, ma con un’ironia raffinata che sa sorprendere. Sei un vero amico e ti voglio bene.  ",
        "chiaracornelio": "Chiara, quest’estate mi sei stata molto vicina e per questo ti ringrazio di cuore. In questo periodo ho conosciuto il tuo lato più umano, profondo e sensibile, e ne sono molto felice. Piano piano questa nuvola fantozziana che ti accompagna svanirà, ne sono certo. Sei forte e tosta, non ti lasciar infastidire o influenzare negativamente dalle persone per le quali non ha senso e non ha valore. Ti voglio bene.",
        "leonardocirilli": "Leo, sei una persona fantastica: super piacevole, sempre capace di strappare un sorriso. Con la tua dolcezza e delicatezza sei voluto bene da tutti. Il tuo unico problema sei tu stesso e la poca fiducia che hai in te. Ma io credo in te amico mio. Ti voglio bene GIL.",
        "giammarcostorani": "Gimmi, possiamo dire di essere cresciuti un po’ insieme. Sei una persona molto dritta, sai sempre ciò che vuoi. Allo stesso tempo sei generoso e attento a chi hai davanti, e questo ti fa onore. Ti ammiro molto per il tuo essere fermo e deciso sulle tue idee. Ti voglio bene.",
        "andreasoldini": "Soldo, sei un compagno, un amico, una di quelle amicizie che, anche se le strade si dividono, restano, perché il bene che provi per una persona non svanisce. Le ore passate insieme a giocare alla Play, a casa tua o a casa mia, pomeriggi interi a studiare e cazzeggiare: ricordi bellissimi. Ti auguro il meglio. Ti voglio bene.",
        "aresiokishta": "Aresio, sei un soggetto (in senso positivo!), un tipo. Come sai raccontare le storie tu, nessuno: ti viene voglia di ascoltarti, riesci a trattenere e intrattenere chiunque. Il numero uno in questo. In futuro magari anche socio? Vedremo.",
        "davidezuin": "Davide, sei molto più di un semplice compagno di corso: con il tempo sei diventato un mio amico. Sensibile, attento e premuroso, hai un’umanità che difficilmente si trova. Ti sono molto grato per tutto ciò che hai fatto per me in questi due anni di università: senza di te sarebbe stato ancora più difficile. Ti ringrazio infinitamente.",
        "diegopassarelli": "Dieghito, mi hai accompagnato in questo percorso arduo. Con il tuo modo di essere. Sempre pronto a far serata, senza mollare di un centimetro. Ma sono riuscito anche a cogliere un lato molto più sensibile di te. Ascoltalo e aiutalo. È bello anche essere fragili a volte. Ti voglio bene.",
        "enricobesoli": "Enrico, sei un tipo un po' taciturno, ma presente. Una certezza. Poche parole, ma fatti, sempre pronto a darmi una mano. Ti ringrazio per avermi accompagnato e aiutato durante questi due anni di università.",
        "valeriacocco": "Vale, sei entrata nel mio mondo attraverso Giorgio. Ho visto in lui una luce diversa, un ragazzo che ha trovato la sua anima gemella. Sono davvero contento che lo rendi felice: per me è una cosa importante. Detto questo, Vale, ti sei mostrata molto accogliente e sempre sorridente nei miei confronti. Spero che pian piano riuscirai ad ambientarti qui da noi; magari riuscirò anch’io a dare un piccolo contributo, e ne sarei felice. Grazie per essere qui oggi a festeggiare questo traguardo insieme a me!",
        "francescoelisei": "Elis, sei un ragazzo dal cuore d’oro, e lo dimostri soprattutto con i cani. In quest’ultimo periodo mi sei stato molto vicino e di questo ti ringrazio. Vorrei ringraziarti per la tua presenza e per la nostra amicizia. Ti voglio bene.",
        "melisamema": "Meli, sei stata un piacevole scoperta. Un carattere veramente tosto, forte e difficile, ma una volta compreso davvero bello. Hai veramente molto da dare e fai bene alle persone che hai vicino. Ti ringrazio perché con me lo hai fatto in un momento pesante della mia vita e senza aspettarti nulla in cambio. Grazie, ti voglio bene.",
        "micheledelgobbo": "Mic, che dire. La nostra amicizia risale a davvero tanto tempo fa. Ricordo quando da piccoli passavamo intere giornate nelle nostre case, a giocare a Fifa per pomeriggi interi o a studiare con Adriana (festeggiamo anche per lei oggi) e poi quando giocavamo a calcio sul tuo terrazzo. Sono ricordi che porterò sempre con me. Sono davvero felice che siamo riusciti a riavvicinarci, dopo che le nostre strade si erano allontanate. Grazie di essere qui a festeggiare questo traguardo insieme a me.",
        "matildepiliego": "Mati, sei stata molto più che una semplice coinquilina. Ho trovato in te un’amica sempre pronta ad ascoltarmi e a darmi un consiglio giusto. Ho passato un anno veramente molto pesante a Padova, non a causa tua o di Edo, ma grazie alla vostra presenza siete riusciti a non farmi mollare tutto e mi avete sempre tirato su il morale. Siete stati una seconda famiglia. Per questo ti ringrazio di esserci stata e di essere qui oggi a festeggiare con me questo grande traguardo: è anche per merito tuo se oggi siamo qui a festeggiare questo traguardo. Ti voglio bene.",

        
        // ATTENZIONE: il nome inserito dall'utente viene convertito in minuscolo prima del confronto.

    // Messaggio di default (se il nome non è nella lista)
    const defaultMessage = "Grazie per essere stato parte di questo viaggio. La tua vicinanza, anche silenziosa, mi ha dato la forza di arrivare fino in fondo. Te ne sono grato.";

    // ------------------------------------------------------------------
    // 2. GESTIONE LOGIN E VISUALIZZAZIONE MESSAGGIO
    // ------------------------------------------------------------------
    const loginCard = document.getElementById('loginCard');
    const userInput = document.getElementById('userInput');
    const loginBtn = document.getElementById('loginBtn');
    const errorDiv = document.getElementById('errorMsg');

    // Funzione per normalizzare il testo (togli spazi extra, converti in minuscolo)
    function normalizeName(raw) {
        return raw.trim().toLowerCase();
    }

    // Mostra il messaggio personalizzato all'interno della stessa card
    function showMessage(personName, personalizedText) {
        // Sostituisce il contenuto della card con la sola area messaggi
        loginCard.innerHTML = `
            <div class="message-area" style="display:block;">
                <h3>💌 Ciao ${personName},</h3>
                <p>${personalizedText}</p>
                <button class="reset-btn" id="resetBtn">🔁 Torna alla schermata iniziale</button>
            </div>
            <footer style="margin-top:20px;">🎓 Tesi di Laurea – Giacomo</footer>
        `;
        const resetBtn = document.getElementById('resetBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                window.location.reload();
            });
        }
    }

    function attemptLogin() {
        const rawName = userInput.value;
        if (!rawName) {
            errorDiv.style.display = 'block';
            errorDiv.innerText = '❌ Inserisci un nome per continuare.';
            return;
        }
        const normalized = normalizeName(rawName);
        const displayName = rawName.trim();

        if (messages[normalized]) {
            // Nome riconosciuto: messaggio personalizzato
            showMessage(displayName, messages[normalized]);
        } else {
            // Nome non riconosciuto: messaggio di default (nessun errore)
            showMessage(displayName, defaultMessage);
        }
    }

    loginBtn.addEventListener('click', attemptLogin);
    userInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            attemptLogin();
        }
    });
</script>
</body>
</html>
